name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.architecture }}
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      - name: Validate signed tag and runner architecture
        env:
          RELEASE_TAG_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_TAG_GPG_PUBLIC_KEY }}
        run: |
          set -eu
          test "$(uname -m)" = "${{ matrix.architecture }}"
          printf '%s' "$RELEASE_TAG_GPG_PUBLIC_KEY" | gpg --batch --import
          git verify-tag "$GITHUB_REF_NAME"
          version=${GITHUB_REF_NAME#v}
          test -n "$version"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Configure ephemeral Apple signing keychain
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/hh-release.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          printf '%s' "$MACOS_CERTIFICATE_P12" | openssl base64 -d -A -out "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-api-key.p8"
          chmod 600 "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary-api-key.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          xcrun notarytool store-credentials hh-ci \
            --key "$RUNNER_TEMP/notary-api-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
      - name: Build, sign, notarize, and verify
        env:
          HH_CODESIGN_IDENTITY: ${{ vars.HH_CODESIGN_IDENTITY }}
          HH_EXPECTED_TEAM_ID: ${{ vars.HH_EXPECTED_TEAM_ID }}
          HH_NOTARY_PROFILE: hh-ci
          HH_RELEASE_TAG: ${{ github.ref_name }}
          HH_UPDATE_BASE_URL: ${{ vars.HH_UPDATE_BASE_URL }}
          HH_UPDATE_KEY_ID: ${{ vars.HH_UPDATE_KEY_ID }}
          HH_UPDATE_PUBLIC_KEY: ${{ secrets.HH_UPDATE_PUBLIC_KEY }}
          HH_UPDATE_SIGNING_SEED: ${{ secrets.HH_UPDATE_SIGNING_SEED }}
        run: |
          set -eu
          key_file="$RUNNER_TEMP/update-signing-seed"
          printf '%s\n' "$HH_UPDATE_SIGNING_SEED" > "$key_file"
          chmod 600 "$key_file"
          export HH_UPDATE_SIGNING_KEY_FILE="$key_file"
          scripts/package-macos-release.sh "${GITHUB_REF_NAME#v}" "$GITHUB_RUN_NUMBER"
      - name: Attest packaged release files
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: target/release-dist/**/*
      - name: Upload packaged release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.architecture }}
          path: target/release-dist/**/*
          if-no-files-found: error
          retention-days: 14
      - name: Destroy ephemeral key material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary-api-key.p8" "$RUNNER_TEMP/update-signing-seed"
          security delete-keychain "$RUNNER_TEMP/hh-release.keychain-db" || true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      - name: Generate locked CycloneDX SBOMs
        run: |
          cargo install --locked cargo-cyclonedx@0.5.9
          cargo cyclonedx --format json --all --all-features --target all --override-filename bom
          tar -czf "Harness-Harlot-${GITHUB_REF_NAME}-sbom.cdx.tar.gz" crates/*/bom.json
      - name: Attest SBOM archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: Harness-Harlot-*-sbom.cdx.tar.gz
      - name: Upload SBOM archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sbom
          path: Harness-Harlot-*-sbom.cdx.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable release assets
    needs: [package, sbom]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish signed-tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/*/* release-assets/*.tar.gz --repo "$GITHUB_REPOSITORY"
