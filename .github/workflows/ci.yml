name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full run on main: coverage for skipped main pushes and the only
    # writer of the main-branch build caches that pull requests restore.
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # crates.io downloads intermittently fail with HTTP/2 framing errors on hosted
  # runners; retry more and avoid HTTP/2 multiplexing.
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  already-tested:
    name: Skip main push when its pull request already tested this tree
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tested: ${{ steps.find.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        name: Look for a green CI run on the identical tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 scripts/find-green-ci-run.py --repo "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --workflow ci.yml --exclude-run "$GITHUB_RUN_ID" \
            --job "Fast quality gate" --job "macOS quality gate"; then
            echo tested=true >> "$GITHUB_OUTPUT"
          else
            echo tested=false >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Fast quality gate
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Pull requests test their exact head tree, which is what
          # find-green-ci-run.py compares against a merged or tagged commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.96"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-linux-x86_64
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/check-structure.sh
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bzip2 curl clang cmake pkg-config libfontconfig1-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libssl-dev libgtk-3-dev libnss3-dev libasound2-dev libgbm-dev
      - name: Restore pinned Linux CEF archive
        id: cef-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cef-downloads/cef_binary_151.3.18+gbeff58d+chromium-151.0.7922.138_linux64_minimal.tar.bz2
          key: cef-554c2c107a4ca8d555273c0c0d0c1efdfbbb5a2d9ba3a2387dbdf3b622bdb24c-linux64
      - name: Download, verify, and prepare pinned Linux CEF
        env:
          CEF_ARCHIVE: cef_binary_151.3.18+gbeff58d+chromium-151.0.7922.138_linux64_minimal.tar.bz2
          CEF_SHA256: 554c2c107a4ca8d555273c0c0d0c1efdfbbb5a2d9ba3a2387dbdf3b622bdb24c
        run: |
          set -eu
          download_directory="$RUNNER_TEMP/cef-downloads"
          extract_directory="$RUNNER_TEMP/cef"
          archive="$download_directory/$CEF_ARCHIVE"
          mkdir -p "$download_directory"
          if [ ! -f "$archive" ]; then
            curl --proto '=https' --tlsv1.2 -fL \
              --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
              "https://cef-builds.spotifycdn.com/$CEF_ARCHIVE" \
              -o "$archive.tmp"
            printf '%s  %s\n' "$CEF_SHA256" "$archive.tmp" | sha256sum -c -
            mv "$archive.tmp" "$archive"
          fi
          printf '%s  %s\n' "$CEF_SHA256" "$archive" | sha256sum -c -
          rm -rf "$extract_directory"
          mkdir -p "$extract_directory"
          tar -xjf "$archive" -C "$extract_directory"
          cef_source="$extract_directory/${CEF_ARCHIVE%.tar.bz2}"
          test -f "$cef_source/Release/libcef.so"
          cef_runtime="$RUNNER_TEMP/cef-runtime"
          rm -rf "$cef_runtime"
          mkdir -p "$cef_runtime"
          cp -a "$cef_source/Release/." "$cef_runtime/"
          cp -a "$cef_source/Resources/." "$cef_runtime/"
          printf '{"type":"minimal","name":"%s","sha256":"%s"}\n' \
            "$CEF_ARCHIVE" "$CEF_SHA256" > "$cef_runtime/archive.json"
          test -f "$cef_runtime/libcef.so"
          test -f "$cef_runtime/icudtl.dat"
          test -d "$cef_runtime/locales"
          printf 'CEF_PATH=%s\n' "$cef_runtime" >> "$GITHUB_ENV"
      - name: Save pinned Linux CEF archive from main
        if: github.ref == 'refs/heads/main' && steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cef-downloads/cef_binary_151.3.18+gbeff58d+chromium-151.0.7922.138_linux64_minimal.tar.bz2
          key: cef-554c2c107a4ca8d555273c0c0d0c1efdfbbb5a2d9ba3a2387dbdf3b622bdb24c-linux64
      - name: Verify Linux browser compile
        run: cargo check --locked -p hh-desktop --features browser
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features

  macos-quality:
    # The full macOS clippy and test suite runs here, before merge, so the
    # release workflow can reuse this result instead of re-running it on the tag.
    name: macOS quality gate
    needs: already-tested
    if: ${{ !cancelled() && needs.already-tested.outputs.tested != 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.96"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ci-macos-arm64
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
