name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          components: clippy,rustfmt
      - run: scripts/check-structure.sh
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bzip2 curl clang cmake pkg-config libfontconfig1-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libssl-dev libgtk-3-dev libnss3-dev libasound2-dev libgbm-dev
      - name: Cache pinned Linux CEF archive
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cef-downloads/cef_binary_151.3.18+gbeff58d+chromium-151.0.7922.138_linux64_minimal.tar.bz2
          key: cef-5fc23dcccfead1044b2c3bf02e4ad27e86c29c0f-linux64
      - name: Download, verify, and prepare pinned Linux CEF
        if: runner.os == 'Linux'
        env:
          CEF_ARCHIVE: cef_binary_151.3.18+gbeff58d+chromium-151.0.7922.138_linux64_minimal.tar.bz2
          CEF_SHA1: 5fc23dcccfead1044b2c3bf02e4ad27e86c29c0f
        run: |
          set -eu
          download_directory="$RUNNER_TEMP/cef-downloads"
          extract_directory="$RUNNER_TEMP/cef"
          archive="$download_directory/$CEF_ARCHIVE"
          mkdir -p "$download_directory"
          if [ ! -f "$archive" ]; then
            curl --proto '=https' --tlsv1.2 -fL \
              "https://cef-builds.spotifycdn.com/$CEF_ARCHIVE" \
              -o "$archive.tmp"
            printf '%s  %s\n' "$CEF_SHA1" "$archive.tmp" | sha1sum -c -
            mv "$archive.tmp" "$archive"
          fi
          printf '%s  %s\n' "$CEF_SHA1" "$archive" | sha1sum -c -
          rm -rf "$extract_directory"
          mkdir -p "$extract_directory"
          tar -xjf "$archive" -C "$extract_directory"
          cef_source="$extract_directory/${CEF_ARCHIVE%.tar.bz2}"
          test -f "$cef_source/Release/libcef.so"
          cef_runtime="$RUNNER_TEMP/cef-runtime"
          rm -rf "$cef_runtime"
          mkdir -p "$cef_runtime"
          cp -a "$cef_source/Release/." "$cef_runtime/"
          cp -a "$cef_source/Resources/." "$cef_runtime/"
          printf '{"type":"minimal","name":"%s","sha1":"%s"}\n' \
            "$CEF_ARCHIVE" "$CEF_SHA1" > "$cef_runtime/archive.json"
          test -f "$cef_runtime/libcef.so"
          test -f "$cef_runtime/icudtl.dat"
          test -d "$cef_runtime/locales"
          printf 'CEF_PATH=%s\n' "$cef_runtime" >> "$GITHUB_ENV"
      - name: Verify Linux browser compile
        if: runner.os == 'Linux'
        run: cargo check --locked -p hh-desktop --features browser
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - name: Verify macOS release and installer fixtures
        if: runner.os == 'macOS'
        run: |
          scripts/test-installer.sh
          scripts/test-release-fixture.sh
          scripts/test-community-macos-release.sh
          scripts/test-update-tool.sh
      - name: Verify Linux release and updater fixtures
        if: runner.os == 'Linux'
        run: |
          scripts/test-linux-update-tool.sh
          scripts/test-linux-release-fixture.sh
