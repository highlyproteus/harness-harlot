name: Packaging Assurance

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/updater/**"
      - "crates/release-signer/**"
      - "crates/desktop/src/cli.rs"
      - "crates/desktop/src/main.rs"
      - "crates/desktop/src/updates.rs"
      - "crates/desktop/src/sidebar/**"
      - "crates/cef-view/**"
      - "install*.sh"
      - "packaging/**"
      - "scripts/build-*.sh"
      - "scripts/package-*.sh"
      - "scripts/sign-*.sh"
      - "scripts/test-*.sh"
      - "scripts/verify-*.sh"
  push:
    branches: [main]
  schedule:
    - cron: "31 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-fixtures:
    name: macOS release and updater fixtures
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: packaging-macos-arm64
          cache-targets: true
      - run: |
          scripts/test-installer.sh
          scripts/test-release-fixture.sh
          scripts/test-community-macos-release.sh
          scripts/test-update-tool.sh

  linux-fixtures:
    name: Linux release and updater fixtures
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bzip2 curl clang cmake pkg-config libfontconfig1-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libssl-dev libgtk-3-dev libnss3-dev libasound2-dev libgbm-dev
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: packaging-linux-x86_64
          cache-targets: true
      - run: |
          scripts/test-linux-update-tool.sh
          scripts/test-linux-release-fixture.sh
