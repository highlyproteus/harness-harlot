name: Edge Update

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: edge-update-macos-arm64
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: Publish macOS ARM64 edge update
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    environment: release
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: edge-macos-arm64-community
          cache-targets: true
      - name: Cache pinned CEF archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cef-downloads/cef_binary_151.3.18+gbeff58d+chromium-151.0.7922.138_macosarm64_minimal.tar.bz2
          key: cef-8245a003c52c01811310b9b7d026e92dff859626-macosarm64
      - name: Download, verify, and extract pinned CEF
        env:
          CEF_ARCHIVE: cef_binary_151.3.18+gbeff58d+chromium-151.0.7922.138_macosarm64_minimal.tar.bz2
          CEF_SHA1: 8245a003c52c01811310b9b7d026e92dff859626
        run: |
          set -eu
          download_directory="$RUNNER_TEMP/cef-downloads"
          extract_directory="$RUNNER_TEMP/cef"
          archive="$download_directory/$CEF_ARCHIVE"
          mkdir -p "$download_directory" "$extract_directory"
          if [ ! -f "$archive" ]; then
            curl --proto '=https' --tlsv1.2 -fL \
              "https://cef-builds.spotifycdn.com/$CEF_ARCHIVE" -o "$archive.tmp"
            printf '%s  %s\n' "$CEF_SHA1" "$archive.tmp" | shasum -a 1 -c -
            mv "$archive.tmp" "$archive"
          fi
          printf '%s  %s\n' "$CEF_SHA1" "$archive" | shasum -a 1 -c -
          tar -xjf "$archive" -C "$extract_directory"
          cef_path="$extract_directory/${CEF_ARCHIVE%.tar.bz2}"
          test -d "$cef_path/Release/Chromium Embedded Framework.framework"
          printf 'CEF_PATH=%s\n' "$cef_path" >> "$GITHUB_ENV"
      - name: Build, sign, package, and verify edge update
        env:
          HH_RELEASE_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          HH_UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/edge-macos-arm64
          HH_UPDATE_CHANNEL: edge
          HH_UPDATE_KEY_ID: ${{ vars.HH_UPDATE_KEY_ID }}
          HH_UPDATE_PUBLIC_KEY: ${{ secrets.HH_UPDATE_PUBLIC_KEY }}
          HH_UPDATE_SIGNING_SEED: ${{ secrets.HH_UPDATE_SIGNING_SEED }}
        run: |
          set -eu
          version=$(cargo metadata --locked --format-version 1 --no-deps | \
            plutil -extract packages.0.version raw -o - -)
          build=$(git rev-list --count HEAD)
          key_file="$RUNNER_TEMP/update-signing-seed"
          printf '%s\n' "$HH_UPDATE_SIGNING_SEED" > "$key_file"
          chmod 600 "$key_file"
          export HH_UPDATE_SIGNING_KEY_FILE="$key_file"
          scripts/package-macos-release.sh "$version" "$build" --community
      - name: Attest edge package
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: target/release-dist/**/*
      - name: Stage and publish complete signed edge feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          source_sha=$(git rev-parse HEAD)
          feed=edge-macos-arm64
          build=$(git rev-list --count HEAD)
          candidate="$feed-b$build"
          if gh release view "$candidate" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$candidate" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$candidate" --repo "$GITHUB_REPOSITORY" --target "$source_sha" \
            --title "Harness Harlot edge" --notes "Verified macOS ARM64 edge build from $source_sha" \
            --prerelease --draft
          cleanup_draft() {
            is_draft=$(gh release view "$candidate" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft 2>/dev/null || true)
            if [ "$is_draft" = true ]; then
              gh release delete "$candidate" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            fi
          }
          trap cleanup_draft EXIT HUP INT TERM
          artifact=$(find target/release-dist -type f -name '*.dmg' -print -quit)
          test -n "$artifact"
          gh release upload "$candidate" "$artifact" --repo "$GITHUB_REPOSITORY"
          find target/release-dist -type f ! -name '*.dmg' -print0 | \
            xargs -0 gh release upload "$candidate" --repo "$GITHUB_REPOSITORY"
          if gh release view "$feed" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$feed" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release edit "$candidate" --repo "$GITHUB_REPOSITORY" \
            --tag "$feed" --draft=false
          trap - EXIT HUP INT TERM
      - name: Destroy update signing seed
        if: always()
        run: rm -f "$RUNNER_TEMP/update-signing-seed"
