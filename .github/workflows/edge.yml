name: Edge Update

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: edge-update-macos-arm64
  cancel-in-progress: false

jobs:
  build-edge:
    name: Build unsigned macOS ARM64 edge update
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Bind edge build to current main and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          remote_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$remote_main" = "$CANDIDATE_SHA"
          ci_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"$CANDIDATE_SHA\") | .id" | head -n 1)
          test -n "$ci_run"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: edge-macos-arm64-community
          cache-targets: true
      - name: Cache pinned CEF archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/cef-downloads/cef_binary_151.3.18+gbeff58d+chromium-151.0.7922.138_macosarm64_minimal.tar.bz2
          key: cef-70c8b97c4dead81b67a8fb29b80da12681e008d4ae9a9778f59e5a2f2adc4e08-macosarm64
      - name: Download, SHA-256 verify, and extract pinned CEF
        env:
          CEF_ARCHIVE: cef_binary_151.3.18+gbeff58d+chromium-151.0.7922.138_macosarm64_minimal.tar.bz2
          CEF_SHA256: 70c8b97c4dead81b67a8fb29b80da12681e008d4ae9a9778f59e5a2f2adc4e08
        run: |
          set -eu
          download_directory="$RUNNER_TEMP/cef-downloads"
          extract_directory="$RUNNER_TEMP/cef"
          archive="$download_directory/$CEF_ARCHIVE"
          mkdir -p "$download_directory" "$extract_directory"
          if [ ! -f "$archive" ]; then
            curl --proto '=https' --tlsv1.2 -fL \
              "https://cef-builds.spotifycdn.com/$CEF_ARCHIVE" -o "$archive.tmp"
            printf '%s  %s\n' "$CEF_SHA256" "$archive.tmp" | shasum -a 256 -c -
            mv "$archive.tmp" "$archive"
          fi
          printf '%s  %s\n' "$CEF_SHA256" "$archive" | shasum -a 256 -c -
          tar -xjf "$archive" -C "$extract_directory"
          cef_path="$extract_directory/${CEF_ARCHIVE%.tar.bz2}"
          test -d "$cef_path/Release/Chromium Embedded Framework.framework"
          printf 'CEF_PATH=%s\n' "$cef_path" >> "$GITHUB_ENV"
      - name: Build and verify unsigned edge package
        env:
          HH_RELEASE_COMMIT: ${{ env.CANDIDATE_SHA }}
          HH_RELEASE_UNSIGNED: 1
          HH_UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/edge-macos-arm64
          HH_UPDATE_CHANNEL: edge
          HH_UPDATE_KEY_ID: hh-edge-2026-v1
        run: |
          set -eu
          version=$(cargo metadata --locked --format-version 1 --no-deps | \
            plutil -extract packages.0.version raw -o - -)
          build=$(git rev-list --count HEAD)
          scripts/package-macos-release.sh "$version" "$build" --community
      - name: Attest unsigned edge package
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: target/release-dist/**/*
      - name: Upload unsigned edge package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-unsigned-macos-arm64
          path: target/release-dist/**/*
          if-no-files-found: error
          retention-days: 7

  sign-edge:
    name: Sign edge-v1 manifests in isolated job
    needs: build-edge
    environment: edge-signing-v1
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: edge-unsigned-macos-arm64
          path: ${{ runner.temp }}/unsigned
      - name: Verify edge build provenance before exposing a signing seed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' links < <(find "$RUNNER_TEMP/unsigned" -type l -print0)
          (( ${#links[@]} == 0 ))
          mapfile -d '' files < <(find "$RUNNER_TEMP/unsigned" -type f -print0 | sort -z)
          (( ${#files[@]} > 0 ))
          for file in "${files[@]}"; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" >/dev/null
          done
      - name: Validate unsigned edge manifests and artifact bindings
        env:
          HH_UPDATE_KEY_ID: ${{ vars.HH_UPDATE_KEY_ID }}
        run: |
          set -eu
          python3 - "$RUNNER_TEMP/unsigned" "$HH_UPDATE_KEY_ID" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/manifests.list" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1]).resolve()
          key_id, repository, list_path = sys.argv[2:]
          assert key_id == "hh-edge-2026-v1"
          paths = list(root.rglob("*"))
          assert len(paths) <= 64
          assert not any(path.is_symlink() for path in paths)
          files = [path for path in paths if path.is_file()]
          by_name = {path.name: path for path in files}
          assert len(by_name) == len(files)
          manifests = sorted(path for path in files if path.name.endswith(".update.json"))
          assert len(manifests) == 2
          assert "manifest-macos-community-arm64-v2.update.json" in by_name
          raw_copies = []
          expected_files = set()
          for path in manifests:
              expected_files.add(path.name)
              manifest = json.loads(path.read_text(encoding="utf-8"))
              assert manifest["schema"] == "hh-update-manifest-v2"
              assert manifest["channel"] == "edge"
              assert manifest["key_id"] == key_id
              assert manifest["platform"] == "macos"
              assert len(manifest["artifacts"]) == 1
              artifact = manifest["artifacts"][0]
              assert artifact["platform"] == "macos"
              assert artifact["architecture"] == "arm64"
              assert artifact["format"] == "dmg"
              artifact_path = by_name[artifact["file_name"]]
              expected_files.add(artifact_path.name)
              assert artifact_path.stat().st_size == artifact["size"]
              assert hashlib.sha256(artifact_path.read_bytes()).hexdigest() == artifact["sha256"]
              expected_url = f"https://github.com/{repository}/releases/download/edge-macos-arm64/{artifact_path.name}"
              assert artifact["url"] == expected_url
              raw_copies.append(path.read_bytes())
          assert len(set(raw_copies)) == 1
          assert set(by_name) == expected_files, sorted(set(by_name) - expected_files)
          pathlib.Path(list_path).write_text("".join(str(path) + "\n" for path in manifests), encoding="utf-8")
          PY
      - name: Prepare pinned isolated signer
        run: |
          set -eu
          # BEGIN ISOLATED SIGNER V1
          cat > "$RUNNER_TEMP/isolated-sign.sh" <<'SIGNER'
          #!/bin/sh
          set -eu

          usage() {
            echo "usage: $0 BASE64_SEED_FILE EXPECTED_PUBLIC_KEY MANIFEST SIGNATURE" >&2
            exit 2
          }

          [ "$#" -eq 4 ] || usage
          seed_file=$1
          expected_public_key=$2
          manifest=$3
          signature=$4
          openssl_command=${HH_OPENSSL:-openssl}
          command -v "$openssl_command" >/dev/null 2>&1 || {
            echo "OpenSSL command is unavailable: $openssl_command" >&2
            exit 2
          }

          if [ ! -f "$seed_file" ] || [ -L "$seed_file" ]; then
            echo "signing seed must be a regular non-symlink file" >&2
            exit 2
          fi
          if [ ! -f "$manifest" ] || [ -L "$manifest" ]; then
            echo "manifest must be a regular non-symlink file" >&2
            exit 2
          fi
          [ -n "$expected_public_key" ] || {
            echo "expected public key is empty" >&2
            exit 2
          }

          work=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/hh-isolated-sign.XXXXXX")
          cleanup() {
            rm -rf "$work"
          }
          trap cleanup EXIT HUP INT TERM
          umask 077

          "$openssl_command" base64 -d -A -in "$seed_file" -out "$work/seed.bin"
          [ "$(wc -c < "$work/seed.bin" | tr -d ' ')" = 32 ] || {
            echo "Ed25519 seed must decode to exactly 32 bytes" >&2
            exit 2
          }
          printf '\060\056\002\001\000\060\005\006\003\053\145\160\004\042\004\040' > "$work/private.der"
          cat "$work/seed.bin" >> "$work/private.der"
          rm -f "$work/seed.bin"

          "$openssl_command" pkey -inform DER -in "$work/private.der" -out "$work/private.pem" >/dev/null 2>&1
          "$openssl_command" pkey -in "$work/private.pem" -pubout -out "$work/public.pem" >/dev/null 2>&1
          derived_public_key=$(
            "$openssl_command" pkey -in "$work/private.pem" -pubout -outform DER 2>/dev/null |
              tail -c 32 |
              "$openssl_command" base64 -A
          )
          [ "$derived_public_key" = "$expected_public_key" ] || {
            echo "signing seed does not match the expected public key" >&2
            exit 2
          }

          "$openssl_command" pkeyutl -sign -inkey "$work/private.pem" -rawin \
            -in "$manifest" -out "$work/signature.bin"
          "$openssl_command" pkeyutl -verify -pubin -inkey "$work/public.pem" -rawin \
            -in "$manifest" -sigfile "$work/signature.bin" >/dev/null
          "$openssl_command" base64 -A -in "$work/signature.bin" -out "$signature"
          printf '\n' >> "$signature"
          chmod 0644 "$signature"
          SIGNER
          # END ISOLATED SIGNER V1
          chmod 0755 "$RUNNER_TEMP/isolated-sign.sh"
      - name: Materialize edge-v1 seed after all untrusted inputs are validated
        env:
          HH_UPDATE_SIGNING_SEED: ${{ secrets.HH_UPDATE_SIGNING_SEED }}
        run: |
          set -eu
          umask 077
          test -n "$HH_UPDATE_SIGNING_SEED"
          printf '%s' "$HH_UPDATE_SIGNING_SEED" > "$RUNNER_TEMP/signing-seed.b64"
          unset HH_UPDATE_SIGNING_SEED
      - name: Sign validated edge-v1 manifests without checkout or network credentials
        env:
          HH_UPDATE_PUBLIC_KEY: ${{ vars.HH_UPDATE_PUBLIC_KEY }}
        run: |
          set -eu
          test -n "$HH_UPDATE_PUBLIC_KEY"
          mkdir -p "$RUNNER_TEMP/edge-signatures"
          while IFS= read -r manifest; do
            "$RUNNER_TEMP/isolated-sign.sh" \
              "$RUNNER_TEMP/signing-seed.b64" "$HH_UPDATE_PUBLIC_KEY" \
              "$manifest" "$RUNNER_TEMP/edge-signatures/$(basename "$manifest").sig"
          done < "$RUNNER_TEMP/manifests.list"
      - name: Destroy edge-v1 private material
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/signing-seed.b64" 2>/dev/null || rm -f "$RUNNER_TEMP/signing-seed.b64"
      - name: Attest edge-v1 signatures
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/edge-signatures/*.sig
      - name: Upload edge-v1 signatures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-v1-signatures
          path: ${{ runner.temp }}/edge-signatures/*.sig
          if-no-files-found: error
          retention-days: 7

  publish-edge:
    name: Verify and publish complete edge feed
    needs:
      - build-edge
      - sign-edge
    environment: edge-publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: edge-unsigned-macos-arm64
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: edge-v1-signatures
          path: release-assets
      - name: Verify provenance for every edge asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' links < <(find release-assets -type l -print0)
          (( ${#links[@]} == 0 ))
          mapfile -d '' files < <(find release-assets -type f -print0 | sort -z)
          (( ${#files[@]} > 0 ))
          for file in "${files[@]}"; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" >/dev/null
          done
      - name: Verify source, signature, and artifact digest
        env:
          GH_TOKEN: ${{ github.token }}
          EDGE_PUBLIC_KEY: ${{ vars.HH_UPDATE_EDGE_PUBLIC_KEY_V1 }}
        run: |
          set -eu
          remote_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$remote_main" = "$CANDIDATE_SHA"
          ci_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"$CANDIDATE_SHA\") | .id" | head -n 1)
          test -n "$ci_run"
          test -n "$EDGE_PUBLIC_KEY"
          python3 - release-assets "$EDGE_PUBLIC_KEY" <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import subprocess
          import sys
          import tempfile

          root = pathlib.Path(sys.argv[1]).resolve()
          public_key = sys.argv[2]
          paths = list(root.rglob("*"))
          assert len(paths) <= 64
          assert not any(path.is_symlink() for path in paths)
          files = [path for path in paths if path.is_file()]
          by_name = {path.name: path for path in files}
          assert len(by_name) == len(files)
          manifests = sorted(path for path in files if path.name.endswith(".update.json"))
          assert len(manifests) == 2
          expected_files = set()
          with tempfile.TemporaryDirectory() as temporary:
              temporary = pathlib.Path(temporary)
              public_der = temporary / "public.der"
              public_pem = temporary / "public.pem"
              public_der.write_bytes(bytes.fromhex("302a300506032b6570032100") + base64.b64decode(public_key, validate=True))
              subprocess.run(["openssl", "pkey", "-pubin", "-inform", "DER", "-in", str(public_der), "-out", str(public_pem)], check=True)
              for index, manifest_path in enumerate(manifests):
                  expected_files.update({manifest_path.name, manifest_path.name + ".sig"})
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                  assert manifest["channel"] == "edge"
                  assert manifest["key_id"] == "hh-edge-2026-v1"
                  signature = temporary / f"signature-{index}.bin"
                  signature.write_bytes(base64.b64decode(by_name[manifest_path.name + ".sig"].read_text().strip(), validate=True))
                  subprocess.run(["openssl", "pkeyutl", "-verify", "-pubin", "-inkey", str(public_pem), "-rawin", "-in", str(manifest_path), "-sigfile", str(signature)], check=True)
                  artifact = manifest["artifacts"][0]
                  artifact_path = by_name[artifact["file_name"]]
                  expected_files.add(artifact_path.name)
                  assert artifact_path.stat().st_size == artifact["size"]
                  assert hashlib.sha256(artifact_path.read_bytes()).hexdigest() == artifact["sha256"]
          assert set(by_name) == expected_files, sorted(set(by_name) - expected_files)
          PY
      - name: Stage and atomically promote complete edge feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          feed=edge-macos-arm64
          candidate="$feed-${CANDIDATE_SHA:0:12}"
          if gh release view "$candidate" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$candidate" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          test "${#assets[@]}" -gt 0
          gh release create "$candidate" --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" \
            --title "Harness Harlot edge" --notes "Verified macOS ARM64 edge build from $CANDIDATE_SHA" \
            --prerelease --draft --latest=false "${assets[@]}"
          cleanup_draft() {
            is_draft=$(gh release view "$candidate" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
            if [ "$is_draft" = true ]; then
              gh release delete "$candidate" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            fi
          }
          trap cleanup_draft EXIT HUP INT TERM
          if gh release view "$feed" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$feed" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release edit "$candidate" --repo "$GITHUB_REPOSITORY" \
            --tag "$feed" --draft=false --latest=false
          trap - EXIT HUP INT TERM
