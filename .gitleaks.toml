title = "Harness Harlot gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Pinned public CEF archive checksum used in the macOS ARM64 cache key"
condition = "AND"
regexTarget = "line"
regexes = ['''key:\s+cef-8245a003c52c01811310b9b7d026e92dff859626-macosarm64''']
paths = ['''^\.github/workflows/edge\.yml$''']

[[rules]]
id = "sourcegraph-access-token"

[[rules.allowlists]]
description = "Git commit and blob IDs recorded as icon provenance in the asset notices"
regexTarget = "match"
regexes = ['''^[0-9a-f]{40}`$''']
paths = ['''^ASSET_NOTICES\.md$''']
