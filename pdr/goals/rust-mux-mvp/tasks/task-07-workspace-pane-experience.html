<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task</title>
<style>
  :root {
    --paper: #F7F5F0;
    --card: #FFFFFF;
    --ink: #1C1B19;
    --ink-soft: #57534A;
    --line: #DEDACF;
    --accent: #3D5A73;
    --done: #4B6A4E;
    --done-bg: #E7EDE4;
    --progress-c: #A6752C;
    --progress-bg: #F3E8D6;
    --blocked: #9C4A3C;
    --blocked-bg: #F5E4DF;
    --idle: #8C8577;
    --idle-bg: #EDEBE4;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', 'IBM Plex Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .topbar {
    position: sticky;
    top: 0;
    background: rgba(247, 245, 240, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    z-index: 10;
  }
  .topbar-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .back-link { font-family: var(--mono); font-size: 13px; color: var(--accent); text-decoration: none; margin-right: auto; }
  .back-link:hover { text-decoration: underline; }

  .pill {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 100px;
  }
  .pill.status-done { background: var(--done-bg); color: var(--done); }
  .pill.status-in_progress { background: var(--progress-bg); color: var(--progress-c); }
  .pill.status-blocked { background: var(--blocked-bg); color: var(--blocked); }
  .pill.status-not_started { background: var(--idle-bg); color: var(--idle); }

  main { max-width: 760px; margin: 0 auto; padding: 0 24px 80px; }

  .hero { padding: 48px 0 32px; }
  .eyebrow { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); margin: 0 0 8px; }
  h1 { font-family: var(--serif); font-size: 32px; line-height: 1.2; margin: 0; font-weight: 600; }

  section { padding: 28px 0; border-top: 1px solid var(--line); }
  .hero + section { border-top: none; }
  h2 {
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 14px;
    font-weight: 600;
  }
  p.body-text { margin: 0; font-size: 15px; }

  #depends-list { list-style: none; margin: 0; padding: 0; }
  #depends-list li {
    display: inline-block;
    font-family: var(--mono);
    font-size: 13px;
    background: var(--idle-bg);
    color: var(--ink-soft);
    padding: 3px 10px;
    border-radius: 100px;
    margin: 0 6px 6px 0;
  }
  #depends-list li.muted { background: none; padding: 0; font-family: var(--sans); font-style: italic; }

  .criteria-list { list-style: none; margin: 0; padding: 0; }
  .criteria-list li { padding: 7px 0; font-size: 15px; }
  .criteria-list li.met { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--line); }
  .check { font-family: var(--mono); margin-right: 8px; }

  .callout { padding: 14px 16px; border-radius: 8px; font-size: 14px; }
  .callout.blocked { background: var(--blocked-bg); color: var(--blocked); }

  .notes-list { list-style: none; margin: 0; padding: 0; }
  .notes-list li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .notes-list li:last-child { border-bottom: none; }
  .timestamp { font-family: var(--mono); color: var(--ink-soft); margin-right: 8px; }
  .muted { color: var(--ink-soft); font-style: italic; }

  footer {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 24px 60px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
  }

  @media (max-width: 600px) {
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<script type="application/json" id="pdr-state">
{
  "id": "task-07",
  "goal_id": "rust-mux-mvp",
  "goal_file": "../PDR.html",
  "title": "Build the workspace and pane experience",
  "description": "Implement a compact behavior-level terminal workspace: dense workspace switching/creation on the left and local terminal panes on the right; horizontal and vertical splits; draggable pane movement; divider resize; local CWD inheritance; and keyboard-first selection/navigation. Remove dashboard, activity, health, and agent-status surfaces. Every mutation is a daemon command and the desktop only projects canonical state. Add SSH workspaces in the next core milestone after local terminals work end to end.",
  "why": "This is the familiar workflow the user wants, while daemon authority prevents visual layout code from becoming session ownership code and keeps local and SSH panes behaviorally equal.",
  "acceptance_criteria": [
    { "text": "Workspace, tab, split, resize, move, and close mutations have deterministic pure-model tests", "met": false },
    { "text": "Drag/drop works within and across panes or tabs without changing local or SSH session IDs", "met": false },
    { "text": "Sidebar clearly distinguishes local and SSH lifecycle states without exposing sensitive host configuration", "met": false },
    { "text": "Directional focus and documented shortcuts behave consistently on macOS and Linux", "met": false },
    { "text": "Layout, focus, titles, CWD metadata, and terminal bindings survive desktop restart", "met": false },
    { "text": "The MVP contains no embedded browser, mobile client, worktree/diff review, or AI-specific integration", "met": true }
  ],
  "depends_on": ["task-02", "task-03", "task-04", "task-06"],
  "status": "in_progress",
  "block_reason": null,
  "notes": [{ "timestamp": "2026-08-11T17:46:06Z", "text": "Narrowed by user direction: the first visible app is workspaces plus real local terminals only. No fake terminal cards, service dashboard, browser, or agent-status UI." }, { "timestamp": "2026-08-11T18:01:19Z", "text": "The live original GPUI interface now follows the supplied behavior/style brief across the full shell: compact rail and workspace rows, one terminal by default, pane-local tabs/controls, horizontal and vertical split trees, resize handles, focus routing, drag-swap mutations, and no invented dashboard surfaces. Close semantics, CWD inheritance, disk persistence, Linux runtime, and SSH parity remain." }, { "timestamp": "2026-08-11T18:11:49Z", "text": "Resumed for human terminal names, right-click Rename/Close, original geometric split icons with tooltips, and left/right/top/bottom drag-to-split previews that move existing live sessions without recreating processes." }, { "timestamp": "2026-08-11T18:42:17Z", "text": "Fixed the user-reported pane-local targeting defect: add and split controls now receive their clicked pane ID before mutation; right-click, rename, close, and tab activation apply the same target-first rule. Two-pane regression tests prove pane-two actions leave pane one unchanged. Live Retina verification showed Terminal 3 added only to the left pane, Terminal 4 added only to the clicked right pane, a seamless half-pane drag preview with no arrow chrome, live Terminal 3 moved into the highlighted split, guarded close collapsing it, and native Rename updating Terminal 4." }, { "timestamp": "2026-08-11T18:52:51Z", "text": "Resumed for the focused tab-strip pass: move close onto each tab, make the complete pane-local tab strip a generous merge destination, retain pointer-local directional previews, and define the lone-tab directional drop as a live-session move plus a fresh replacement terminal in the vacated half." }, { "timestamp": "2026-08-11T19:17:10Z", "text": "Completed the tab drag and close pass. Native Retina verification showed a persistent pointer-local bottom-half preview, a lone-tab drop yielding a fresh terminal above and the original live terminal below, a minimal full-strip merge highlight, and the same live tab merging into the target stack. Hover state now updates on enter/move and clears only on leave, drop, or cancel; unit coverage exercises all four zones and state transitions." }],
  "last_updated": "2026-08-11T21:22:24Z"
}
</script>

<header class="topbar">
  <div class="topbar-inner">
    <a class="back-link" id="back-link" href="../PDR.html">&larr; Back to goal</a>
    <span id="status-pill" class="pill"></span>
  </div>
</header>

<main>
  <section class="hero">
    <p class="eyebrow" id="task-id"></p>
    <h1 id="task-title"></h1>
  </section>

  <section>
    <h2>What needs to happen</h2>
    <p class="body-text" id="task-description"></p>
  </section>

  <section>
    <h2>Why it matters</h2>
    <p class="body-text" id="task-why"></p>
  </section>

  <section>
    <h2>Depends on</h2>
    <ul id="depends-list"></ul>
  </section>

  <section>
    <h2>Definition of done</h2>
    <ul id="criteria-list" class="criteria-list"></ul>
  </section>

  <section id="block-section" style="display:none">
    <h2>Blocked</h2>
    <div class="callout blocked" id="block-callout"></div>
  </section>

  <section>
    <h2>Notes</h2>
    <ul id="notes-list" class="notes-list"></ul>
  </section>
</main>

<footer>
  <p>Last updated <span id="last-updated"></span></p>
</footer>

<script>
(function () {
  var stateEl = document.getElementById('pdr-state');
  var state = JSON.parse(stateEl.textContent);

  var STATUS_LABEL = { done: 'Done', in_progress: 'In progress', blocked: 'Blocked', not_started: 'Not started' };

  document.title = (state.id || 'Task') + ' \u00B7 ' + (state.title || '');
  document.getElementById('back-link').setAttribute('href', state.goal_file || '../PDR.html');
  document.getElementById('task-id').textContent = state.id || '';
  document.getElementById('task-title').textContent = state.title || 'Untitled task';
  document.getElementById('task-description').textContent = state.description || '\u2014';
  document.getElementById('task-why').textContent = state.why || '\u2014';

  var depEl = document.getElementById('depends-list');
  var deps = state.depends_on || [];
  if (deps.length === 0) {
    var noneLi = document.createElement('li');
    noneLi.className = 'muted';
    noneLi.textContent = 'Nothing \u2014 this can start any time.';
    depEl.appendChild(noneLi);
  } else {
    deps.forEach(function (d) {
      var li = document.createElement('li');
      li.textContent = d;
      depEl.appendChild(li);
    });
  }

  var critList = document.getElementById('criteria-list');
  (state.acceptance_criteria || []).forEach(function (c) {
    var text = (typeof c === 'string') ? c : (c.text || '');
    var met = (typeof c === 'object') && !!c.met;
    var li = document.createElement('li');
    li.className = met ? 'met' : 'unmet';
    var check = document.createElement('span');
    check.className = 'check';
    check.setAttribute('aria-hidden', 'true');
    check.textContent = met ? '\u2611' : '\u2610';
    li.appendChild(check);
    li.appendChild(document.createTextNode(text));
    critList.appendChild(li);
  });

  var pill = document.getElementById('status-pill');
  var status = state.status || 'not_started';
  pill.textContent = STATUS_LABEL[status] || STATUS_LABEL.not_started;
  pill.className = 'pill status-' + status;

  if (status === 'blocked') {
    document.getElementById('block-section').style.display = '';
    document.getElementById('block-callout').textContent = state.block_reason || 'No reason given.';
  }

  var notesList = document.getElementById('notes-list');
  var notes = state.notes || [];
  if (notes.length === 0) {
    var emptyLi = document.createElement('li');
    emptyLi.className = 'muted';
    emptyLi.textContent = 'No notes yet.';
    notesList.appendChild(emptyLi);
  } else {
    notes.forEach(function (n) {
      var li = document.createElement('li');
      var ts = document.createElement('span');
      ts.className = 'timestamp';
      ts.textContent = n.timestamp || '';
      li.appendChild(ts);
      li.appendChild(document.createTextNode(n.text || ''));
      notesList.appendChild(li);
    });
  }

  document.getElementById('last-updated').textContent = state.last_updated || '\u2014';
})();
</script>

</body>
</html>
