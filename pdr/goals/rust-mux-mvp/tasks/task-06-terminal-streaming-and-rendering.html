<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task</title>
<style>
  :root {
    --paper: #F7F5F0;
    --card: #FFFFFF;
    --ink: #1C1B19;
    --ink-soft: #57534A;
    --line: #DEDACF;
    --accent: #3D5A73;
    --done: #4B6A4E;
    --done-bg: #E7EDE4;
    --progress-c: #A6752C;
    --progress-bg: #F3E8D6;
    --blocked: #9C4A3C;
    --blocked-bg: #F5E4DF;
    --idle: #8C8577;
    --idle-bg: #EDEBE4;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', 'IBM Plex Mono', Menlo, Consolas, 'Liberation Mono', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .topbar {
    position: sticky;
    top: 0;
    background: rgba(247, 245, 240, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    z-index: 10;
  }
  .topbar-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .back-link { font-family: var(--mono); font-size: 13px; color: var(--accent); text-decoration: none; margin-right: auto; }
  .back-link:hover { text-decoration: underline; }

  .pill {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 100px;
  }
  .pill.status-done { background: var(--done-bg); color: var(--done); }
  .pill.status-in_progress { background: var(--progress-bg); color: var(--progress-c); }
  .pill.status-blocked { background: var(--blocked-bg); color: var(--blocked); }
  .pill.status-not_started { background: var(--idle-bg); color: var(--idle); }

  main { max-width: 760px; margin: 0 auto; padding: 0 24px 80px; }

  .hero { padding: 48px 0 32px; }
  .eyebrow { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); margin: 0 0 8px; }
  h1 { font-family: var(--serif); font-size: 32px; line-height: 1.2; margin: 0; font-weight: 600; }

  section { padding: 28px 0; border-top: 1px solid var(--line); }
  .hero + section { border-top: none; }
  h2 {
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 14px;
    font-weight: 600;
  }
  p.body-text { margin: 0; font-size: 15px; }

  #depends-list { list-style: none; margin: 0; padding: 0; }
  #depends-list li {
    display: inline-block;
    font-family: var(--mono);
    font-size: 13px;
    background: var(--idle-bg);
    color: var(--ink-soft);
    padding: 3px 10px;
    border-radius: 100px;
    margin: 0 6px 6px 0;
  }
  #depends-list li.muted { background: none; padding: 0; font-family: var(--sans); font-style: italic; }

  .criteria-list { list-style: none; margin: 0; padding: 0; }
  .criteria-list li { padding: 7px 0; font-size: 15px; }
  .criteria-list li.met { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--line); }
  .check { font-family: var(--mono); margin-right: 8px; }

  .callout { padding: 14px 16px; border-radius: 8px; font-size: 14px; }
  .callout.blocked { background: var(--blocked-bg); color: var(--blocked); }

  .notes-list { list-style: none; margin: 0; padding: 0; }
  .notes-list li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .notes-list li:last-child { border-bottom: none; }
  .timestamp { font-family: var(--mono); color: var(--ink-soft); margin-right: 8px; }
  .muted { color: var(--ink-soft); font-style: italic; }

  footer {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 24px 60px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
  }

  @media (max-width: 600px) {
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>

<script type="application/json" id="pdr-state">
{
  "id": "task-06",
  "goal_id": "rust-mux-mvp",
  "goal_file": "../PDR.html",
  "title": "Integrate terminal streaming and rendering",
  "description": "First make local shells real end to end: expand the Alacritty adapter for resize, cursor, color, and cell snapshots; define bounded daemon-to-client screen snapshots; render cells through GPUI; and translate keyboard input and focus without putting VT parsing or PTY ownership in the UI. The renderer remains all Rust and must improve through GPUI font discovery, measured cell metrics, its platform rasterizer/GPU atlas, explicit fallback, and cell-correct drawing; Ghostty and libghostty are not integration candidates. Extend the same contract to SSH after the local shell checkpoint succeeds.",
  "why": "An established terminal engine avoids reimplementing escape-sequence semantics, while an explicit streaming contract prevents UI stalls from stalling local or remote process output.",
  "acceptance_criteria": [
    { "text": "Terminal parser/grid tests cover Unicode, color, cursor modes, resize, alternate screen, and scrollback fixtures", "met": false },
    { "text": "A lagging desktop cannot block any PTY read or grow daemon memory beyond documented limits", "met": false },
    { "text": "Sequence gaps trigger a deterministic snapshot resync for local and SSH sessions", "met": false },
    { "text": "Interactive local and SSH shells accept keyboard, IME, paste, mouse, and resize input on macOS and Linux", "met": false },
    { "text": "The renderer remains responsive during sustained high-output workloads", "met": false }
  ],
  "depends_on": ["task-02", "task-04"],
  "status": "in_progress",
  "block_reason": null,
  "notes": [{ "timestamp": "2026-08-11T17:46:06Z", "text": "Local configured-shell rendering/input is the current gate. Full IME, mouse reporting, selection, scrollback UI, and SSH streaming remain subsequent work and must not be claimed by the first proof." }, { "timestamp": "2026-08-11T18:01:19Z", "text": "The bounded local checkpoint now parses real PTY output with Alacritty, snapshots visible lines independently of the client, renders them in GPUI, routes core keyboard input, and resizes PTYs. Styled cells, cursor, Unicode width, IME, paste, mouse, selection, search, high-output testing, event resync, Linux runtime, and SSH remain open." }, { "timestamp": "2026-08-11T18:11:49Z", "text": "Resumed for the first styled-cell renderer: a named original built-in theme informed by locally observed Zed typography/contrast patterns, ANSI SGR foreground/background/style mapping, and visible terminal cursor/focus treatment. No Zed code, assets, palette files, or branding will be reused." }, { "timestamp": "2026-08-11T18:42:17Z", "text": "Implemented and live-verified the Harbor Night theme architecture with ANSI 16-color, indexed, and truecolor foreground/background plus bold, dim, italic, underline, strike, inverse, hidden cells, cursor, and focused-pane treatment. Real zsh output rendered red, green, truecolor blue, and underline in the native window. Unicode shaping, IME, selection, clipboard, mouse, scrollback UI, Linux runtime, and SSH remain open." }, { "timestamp": "2026-08-11T19:10:25Z", "text": "Recorded the user-approved hard all-Rust renderer boundary in docs/terminal-renderer-roadmap.md. The first future slice is GPUI font discovery and fallback plus measured advance/baseline/line height and cell-correct background/cursor painting; direct Ghostty/libghostty integration and a duplicate non-Rust engine are excluded." }, { "timestamp": "2026-08-11T19:48:15Z", "text": "Resumed task-06 for the explicitly authorized first all-Rust typography slice. Scope is GPUI font discovery/fallback, measured advance/ascent/descent/baseline/line height, and grid-aligned glyph backgrounds, decorations, and cursor while leaving Alacritty state, daemon PTY ownership, pane interactions, Unicode shaping, selection, scrollback/search, IME, mouse, and clipboard boundaries unchanged." }, { "timestamp": "2026-08-11T20:08:20Z", "text": "Completed the authorized first typography slice without closing the live daemon. GPUI now resolves Menlo on this Mac with an explicit fallback stack and disabled contextual ligatures; measured advance/ascent/descent/baseline/line height drive run spans, ANSI backgrounds, decorations, cursor, and PTY viewport sizing. New protocol runs preserve authoritative cell counts including wide spacers; the compatibility path for the still-running older daemon expands real tabs at eight-column stops and applies Unicode display width. The sole rebuilt on-screen client (PID 11406) against the unchanged service (PID 69726) showed the exact half-width multi-column ls reproduction with every filename visible and no stray fragments, followed by real emitted red, underlined truecolor, 256-color background, and aligned cursor output. Formatting, strict Clippy, and all 29 tests passed. Linux runtime, additional scale factors, selection, scrollback/search, IME, mouse, and clipboard remain open, so task-06 stays in progress." }, { "timestamp": "2026-08-11T20:23:23Z", "text": "Reopened the listing issue after user verification and completed a responsive pixel-to-grid repair. The client now observes live window bounds and recursively derives each pane's exact PTY rows/columns after sidebar, workspace and pane headers, padding, focus border, split divider, and local ratio. The service no longer applies a conflicting 20x5/300x120 clamp. Current terminal-model tabs are rendered as one blank grid cell while only legacy runs without cell counts expand tab stops, eliminating repeated tab expansion and clipped filename tails. The current native client (PID 31899) and corrected service (PID 25322) were exercised at 720x460, 1280x820, and 1600x900 with one and two panes. Shell stty output matched daemon snapshots: one pane 20x62, 39x131, 43x171; split panes 20x29/30, 39x64/64, 43x84/83. Fresh ls output naturally selected different column counts with complete filenames, and emitted ANSI color/underline/truecolor remained aligned. The prior daemon PID 69726 remains alive on its original socket so its sessions were not destroyed. Task-06 remains in progress for Linux, scale-factor, interaction, and history work." }],
  "last_updated": "2026-08-11T20:23:23Z"
}
</script>

<header class="topbar">
  <div class="topbar-inner">
    <a class="back-link" id="back-link" href="../PDR.html">&larr; Back to goal</a>
    <span id="status-pill" class="pill"></span>
  </div>
</header>

<main>
  <section class="hero">
    <p class="eyebrow" id="task-id"></p>
    <h1 id="task-title"></h1>
  </section>

  <section>
    <h2>What needs to happen</h2>
    <p class="body-text" id="task-description"></p>
  </section>

  <section>
    <h2>Why it matters</h2>
    <p class="body-text" id="task-why"></p>
  </section>

  <section>
    <h2>Depends on</h2>
    <ul id="depends-list"></ul>
  </section>

  <section>
    <h2>Definition of done</h2>
    <ul id="criteria-list" class="criteria-list"></ul>
  </section>

  <section id="block-section" style="display:none">
    <h2>Blocked</h2>
    <div class="callout blocked" id="block-callout"></div>
  </section>

  <section>
    <h2>Notes</h2>
    <ul id="notes-list" class="notes-list"></ul>
  </section>
</main>

<footer>
  <p>Last updated <span id="last-updated"></span></p>
</footer>

<script>
(function () {
  var stateEl = document.getElementById('pdr-state');
  var state = JSON.parse(stateEl.textContent);

  var STATUS_LABEL = { done: 'Done', in_progress: 'In progress', blocked: 'Blocked', not_started: 'Not started' };

  document.title = (state.id || 'Task') + ' \u00B7 ' + (state.title || '');
  document.getElementById('back-link').setAttribute('href', state.goal_file || '../PDR.html');
  document.getElementById('task-id').textContent = state.id || '';
  document.getElementById('task-title').textContent = state.title || 'Untitled task';
  document.getElementById('task-description').textContent = state.description || '\u2014';
  document.getElementById('task-why').textContent = state.why || '\u2014';

  var depEl = document.getElementById('depends-list');
  var deps = state.depends_on || [];
  if (deps.length === 0) {
    var noneLi = document.createElement('li');
    noneLi.className = 'muted';
    noneLi.textContent = 'Nothing \u2014 this can start any time.';
    depEl.appendChild(noneLi);
  } else {
    deps.forEach(function (d) {
      var li = document.createElement('li');
      li.textContent = d;
      depEl.appendChild(li);
    });
  }

  var critList = document.getElementById('criteria-list');
  (state.acceptance_criteria || []).forEach(function (c) {
    var text = (typeof c === 'string') ? c : (c.text || '');
    var met = (typeof c === 'object') && !!c.met;
    var li = document.createElement('li');
    li.className = met ? 'met' : 'unmet';
    var check = document.createElement('span');
    check.className = 'check';
    check.setAttribute('aria-hidden', 'true');
    check.textContent = met ? '\u2611' : '\u2610';
    li.appendChild(check);
    li.appendChild(document.createTextNode(text));
    critList.appendChild(li);
  });

  var pill = document.getElementById('status-pill');
  var status = state.status || 'not_started';
  pill.textContent = STATUS_LABEL[status] || STATUS_LABEL.not_started;
  pill.className = 'pill status-' + status;

  if (status === 'blocked') {
    document.getElementById('block-section').style.display = '';
    document.getElementById('block-callout').textContent = state.block_reason || 'No reason given.';
  }

  var notesList = document.getElementById('notes-list');
  var notes = state.notes || [];
  if (notes.length === 0) {
    var emptyLi = document.createElement('li');
    emptyLi.className = 'muted';
    emptyLi.textContent = 'No notes yet.';
    notesList.appendChild(emptyLi);
  } else {
    notes.forEach(function (n) {
      var li = document.createElement('li');
      var ts = document.createElement('span');
      ts.className = 'timestamp';
      ts.textContent = n.timestamp || '';
      li.appendChild(ts);
      li.appendChild(document.createTextNode(n.text || ''));
      notesList.appendChild(li);
    });
  }

  document.getElementById('last-updated').textContent = state.last_updated || '\u2014';
})();
</script>

</body>
</html>
