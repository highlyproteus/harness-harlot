[package]
name = "hh-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Harness Harlot terminal workspace desktop"

[[bin]]
name = "hh"
path = "src/main.rs"

[features]
default = []
browser = ["dep:hh-cef-view", "hh-cef-view/cef"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
image.workspace = true
libc.workspace = true
hh-protocol = { version = "0.1.0", path = "../protocol" }
hh-terminal-model = { version = "0.1.0", path = "../terminal-model" }
parking_lot.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
hh-cef-view = { path = "../cef-view", optional = true }
hh-macos-icon = { version = "0.1.0", path = "../macos-icon" }
raw-window-handle.workspace = true
[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true
